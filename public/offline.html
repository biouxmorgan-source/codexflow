<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d2633">
    <title>Hors ligne · LoreMundi</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        body { margin: 0; min-height: 100vh; background: #faf8f4; color: #1d2633; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { max-width: 36rem; margin: 0 auto; padding: 3rem 1rem; }
        .logo { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
        .logo span { color: #1f8a8a; }
        h1 { font-size: 1.5rem; margin: 2rem 0 0.5rem; }
        p { color: #57534e; line-height: 1.5; }
        ul { list-style: none; padding: 0; margin: 1.5rem 0; }
        li a { display: block; margin-bottom: 0.5rem; padding: 0.75rem 1rem; border: 1px solid #e7e5e4; border-radius: 0.75rem; background: #fff; color: #2e5b6e; font-weight: 500; text-decoration: none; }
        li a:hover { background: #e6eef1; }
        button { border: 0; border-radius: 0.5rem; padding: 0.5rem 1rem; background: #2e5b6e; color: #fff; font: inherit; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <div class="logo" translate="no">Lore<span>Mundi</span></div>
        <h1 data-text="title">Vous êtes hors ligne</h1>
        <p data-text="body">Cette page n'a pas encore été ouverte sur cet appareil. Les fiches de personnage déjà consultées restent lisibles sans connexion.</p>
        <ul id="sheets"></ul>
        <button type="button" onclick="location.reload()" data-text="retry">Réessayer</button>
    </main>
    <script>
        // Page statique (service worker) : textes traduits ici, selon la langue de l'appareil.
        (() => {
            const texts = {
                en: ['You are offline', 'This page has not been opened on this device yet. Character sheets you have already viewed remain readable without a connection.', 'Try again'],
                de: ['Sie sind offline', 'Diese Seite wurde auf diesem Gerät noch nicht geöffnet. Bereits angesehene Charakterbögen bleiben ohne Verbindung lesbar.', 'Erneut versuchen'],
                es: ['Estás sin conexión', 'Esta página aún no se ha abierto en este dispositivo. Las fichas de personaje ya consultadas siguen disponibles sin conexión.', 'Reintentar'],
                it: ['Sei offline', 'Questa pagina non è ancora stata aperta su questo dispositivo. Le schede dei personaggi già consultate restano leggibili senza connessione.', 'Riprova'],
                pt: ['Você está offline', 'Esta página ainda não foi aberta neste dispositivo. As fichas de personagem já consultadas continuam legíveis sem conexão.', 'Tentar novamente'],
                nl: ['Je bent offline', 'Deze pagina is nog niet geopend op dit apparaat. Personagebladen die je al hebt bekeken, blijven zonder verbinding leesbaar.', 'Opnieuw proberen'],
                pl: ['Jesteś offline', 'Ta strona nie była jeszcze otwierana na tym urządzeniu. Wcześniej przeglądane karty postaci pozostają dostępne bez połączenia.', 'Spróbuj ponownie'],
            };
            const lang = (navigator.languages || [navigator.language]).map((l) => l.slice(0, 2)).find((l) => l === 'fr' || texts[l]);
            if (!texts[lang]) return;
            const [title, body, retry] = texts[lang];
            document.documentElement.lang = lang;
            document.title = title + ' · LoreMundi';
            document.querySelector('[data-text=title]').textContent = title;
            document.querySelector('[data-text=body]').textContent = body;
            document.querySelector('[data-text=retry]').textContent = retry;
        })();

        // Liste les fiches de personnage gardées sur cet appareil par le service worker.
        (async () => {
            if (!('caches' in window)) return;
            const cache = await caches.open('codexflow-pages');
            const list = document.getElementById('sheets');
            for (const request of await cache.keys()) {
                const url = new URL(request.url);
                if (!/^\/campagnes\/\d+\/personnages\/\d+$/.test(url.pathname)) continue;
                const response = await cache.match(request);
                const page = new DOMParser().parseFromString(await response.text(), 'text/html');
                const link = document.createElement('a');
                link.href = url.pathname;
                link.textContent = page.title.split(' · ')[0] || url.pathname;
                const item = document.createElement('li');
                item.append(link);
                list.append(item);
            }
        })();
    </script>
</body>
</html>
